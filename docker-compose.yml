services:
  web-shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberforge-vulnerable-shop
    working_dir: /app/tests/mock_shop_app
    command: ["python", "-m", "flask", "--app", "app", "run", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    networks:
      cyberforge-net:
        aliases:
          - web-shop
          - test-app
          - mock-shop

  unseen-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberforge-unseen-billing
    working_dir: /app/tests/unseen_app_sim
    command: ["python", "-m", "flask", "--app", "app", "run", "--host", "0.0.0.0", "--port", "5001"]
    ports:
      - "5001:5001"
    networks:
      cyberforge-net:
        aliases:
          - unseen-app
          - unseen_app
          - second-app

  cyberforge-correlate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberforge-correlate-api
    working_dir: /app
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CYBERFORGE_DB_PATH=/app/cyberforge_correlate.db
      - CYBERFORGE_ALLOWED_HOSTS=localhost,127.0.0.1,::1,host.docker.internal,web-shop,test-app,mock-shop,unseen-app,unseen_app,second-app
    ports:
      - "8000:8000"
    depends_on:
      - web-shop
      - unseen-app
    networks:
      - cyberforge-net

networks:
  cyberforge-net:
    driver: bridge
